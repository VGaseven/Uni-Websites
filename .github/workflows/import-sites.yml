name: Import sites from Vercel

on:
  push:
    paths:
      - ".github/workflows/import-sites.yml"
      - ".import/*.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download each site's files from its live URL
        run: |
          set -u
          failed=0
          for list in .import/*.txt; do
            site=$(basename "$list" .txt)
            base="https://${site}.vercel.app"
            echo "== $site ($base)"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if ! curl -fsSL --retry 3 --create-dirs -o "$site/$path" "$base/$path"; then
                echo "FAILED: $site/$path"
                failed=$((failed+1))
              fi
            done < "$list"
          done
          echo "failed=$failed"
          echo "$failed" > .import/failed-count

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import site files from Vercel" || echo "nothing to commit"
          git push
